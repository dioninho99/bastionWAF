services:
  bastion:
    build: .
    image: bastionwaf:local
    restart: unless-stopped
    ports:
      - "${BASTION_PUBLIC_BIND:-0.0.0.0}:80:8080"
      - "${BASTION_PUBLIC_BIND:-0.0.0.0}:443:8443"
      - "${BASTION_ADMIN_BIND:-127.0.0.1}:9090:9090"
    environment:
      BASTION_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      BASTION_DATA_DIR: /data
      BASTION_ADMIN_ADDR: 0.0.0.0:9090
      BASTION_ADMIN_ORIGIN: ${BASTION_ADMIN_ORIGIN:-}
      BASTION_ADMIN_SECURE_COOKIE: ${BASTION_ADMIN_SECURE_COOKIE:-false}
      BASTION_ALLOW_PRIVATE_UPSTREAMS: ${BASTION_ALLOW_PRIVATE_UPSTREAMS:-false}
      BASTION_METRICS_TOKEN: ${BASTION_METRICS_TOKEN:-}
      BASTION_UPSTREAM_HEALTH_INTERVAL: ${BASTION_UPSTREAM_HEALTH_INTERVAL:-30}
      BASTION_ACME_EMAIL: ${BASTION_ACME_EMAIL:-}
      BASTION_ACME_DNS_PROVIDER: ${BASTION_ACME_DNS_PROVIDER:-}
      BASTION_ACME_DNS_API_TOKEN: ${BASTION_ACME_DNS_API_TOKEN:-}
      BASTION_ACME_DOMAINS: ${BASTION_ACME_DOMAINS:-}
      BASTION_TLS_CERT: ${BASTION_TLS_CERT:-}
      BASTION_TLS_KEY: ${BASTION_TLS_KEY:-}
    secrets:
      - admin_password
    volumes:
      - bastion_data:/data
      - ./certs:/certs:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 20s

secrets:
  admin_password:
    file: ./secrets/admin_password.txt

volumes:
  bastion_data:
